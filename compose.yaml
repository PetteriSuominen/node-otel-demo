services:
  orders-api:
    build: 
      context: .
      dockerfile: ./apps/orders-api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PRODUCTS_API_URL: http://products-api:3001
      OTEL_SERVICE_NAME: orders-api
      # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    depends_on:
      - products-api
    command:
      - node
      - --import
      - './dist/shared/instrumentation.js'
      - ./dist/orders-api/src/index.js

  products-api:
    build: 
      context: .
      dockerfile: ./apps/products-api/Dockerfile
    ports:
      - "3001:3001"
    environment:  
      PORT: "3001"
      DB_SERVER:  
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      OTEL_SERVICE_NAME: products-api
      # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    # depends_on:
    #   - sql-server
    command:
      - node
      - --import
      - './dist/shared/instrumentation.js'
      - ./dist/products-api/src/index.js
